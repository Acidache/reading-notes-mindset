<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书笔记</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "Songti SC", Georgia, "Times New Roman", serif;
    background-color: #f5f0e8;
    color: #3d3226;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    width: 100%;
    min-height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(30,20,10,0.40) 0%, rgba(30,20,10,0.50) 40%, rgba(30,20,10,0.88) 100%),
      linear-gradient(90deg, rgba(60,40,20,0.3) 0%, transparent 50%, rgba(60,40,20,0.3) 100%),
      url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=1920&q=80') center/cover no-repeat;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: 3rem 2rem;
    animation: heroFadeIn 1s ease-out both;
  }
  @keyframes heroFadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-tag {
    display: inline-block;
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #d4a574;
    border: 1px solid rgba(212,165,116,0.5);
    padding: 0.35rem 1.2rem;
    border-radius: 100px;
    margin-bottom: 1.5rem;
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    margin-bottom: 0.8rem;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }
  .hero-subtitle {
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    color: rgba(255,255,255,0.75);
    font-weight: 300;
    letter-spacing: 0.08em;
  }

  /* ===== Shelf Section ===== */
  .shelf-section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 2rem 5rem;
  }
  .shelf-section.reveal {
    animation: shelfReveal 0.8s 0.3s ease-out both;
  }
  @keyframes shelfReveal {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .shelf-header {
    text-align: center;
    margin-bottom: 3rem;
  }
  .shelf-header h2 {
    font-size: 1.6rem;
    font-weight: 600;
    color: #3d3226;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  .shelf-header h2::before,
  .shelf-header h2::after {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: #c4a882;
  }
  .shelf-header p {
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.9rem;
    color: #8b7355;
    margin-top: 0.5rem;
    letter-spacing: 0.04em;
  }

  /* ===== Bookshelf Visual ===== */
  .bookshelf {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2.5rem;
    padding: 2.5rem 1.5rem 2rem;
    background:
      linear-gradient(180deg, #f5f0e8 0%, #ede4d3 100%);
    border-radius: 4px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.6),
      0 2px 12px rgba(0,0,0,0.06);
  }
  /* Wooden shelf bottom */
  .bookshelf::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 14px;
    background: linear-gradient(180deg,
      #c4a060 0%,
      #a07840 30%,
      #8b6330 60%,
      #7a5530 100%);
    border-radius: 0 0 3px 3px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.15),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  /* Wood grain lines */
  .bookshelf::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 14px;
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 30px,
        rgba(0,0,0,0.04) 30px,
        rgba(0,0,0,0.04) 31px,
        transparent 31px,
        transparent 60px,
        rgba(0,0,0,0.03) 60px,
        rgba(0,0,0,0.03) 61px
      );
    border-radius: 0 0 3px 3px;
    z-index: 1;
    pointer-events: none;
  }

  /* ===== Book Card ===== */
  .book-card {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    width: 160px;
    transition: transform 0.25s ease, filter 0.25s ease;
    cursor: pointer;
  }
  .book-card:hover {
    transform: translateY(-8px);
  }
  .book-card:hover .book-cover {
    box-shadow:
      0 12px 28px rgba(0,0,0,0.18),
      0 4px 8px rgba(0,0,0,0.10);
  }

  /* Book 3D cover */
  .book-cover {
    position: relative;
    width: 140px;
    height: 200px;
    border-radius: 3px 8px 8px 3px;
    overflow: hidden;
    box-shadow:
      0 6px 18px rgba(0,0,0,0.13),
      0 2px 4px rgba(0,0,0,0.08);
    transition: box-shadow 0.25s ease;
  }
  /* Spine */
  .book-cover::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: linear-gradient(90deg,
      rgba(0,0,0,0.25) 0%,
      rgba(0,0,0,0.08) 40%,
      rgba(255,255,255,0.06) 70%,
      rgba(0,0,0,0.04) 100%);
    z-index: 3;
  }
  /* Page edge */
  .book-cover::after {
    content: '';
    position: absolute;
    right: 0;
    top: 4px;
    bottom: 4px;
    width: 6px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.5) 0%,
      rgba(255,255,255,0.2) 50%,
      rgba(0,0,0,0.05) 100%);
    border-radius: 0 4px 4px 0;
    z-index: 1;
  }

  /* Book cover design */
  .book-cover-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1rem 1.5rem 1.2rem;
    z-index: 2;
  }
  .book-cover-icon {
    font-size: 2.2rem;
    margin-bottom: 0.8rem;
    opacity: 0.9;
  }
  .book-cover-title {
    font-size: 1.05rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
  }
  .book-cover-author {
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.7rem;
    text-align: center;
    opacity: 0.8;
    letter-spacing: 0.04em;
  }

  /* Individual book colors */
  .book-mindset .book-cover {
    background: linear-gradient(160deg, #2c3e50 0%, #1a252f 40%, #2c3e50 100%);
  }
  .book-mindset .book-cover-title,
  .book-mindset .book-cover-author {
    color: #ecf0f1;
  }
  .book-mindset .book-cover-icon {
    color: #e74c3c;
  }

  /* Book: 思考，快与慢 */
  .book-thinking .book-cover {
    background: linear-gradient(160deg, #1a5276 0%, #0e2f44 40%, #1a5276 100%);
  }
  .book-thinking .book-cover-title,
  .book-thinking .book-cover-author {
    color: #d4e6f1;
  }
  .book-thinking .book-cover-icon {
    color: #f39c12;
  }

  /* Future book placeholder */
  .book-placeholder .book-cover {
    background: linear-gradient(160deg, #e8e0d5 0%, #dcd3c6 40%, #e8e0d5 100%);
    border: 2px dashed #c4a882;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .book-placeholder {
    cursor: default;
  }
  .book-placeholder:hover {
    transform: none;
  }
  .book-placeholder .book-cover-inner {
    opacity: 0.45;
  }
  .book-placeholder .book-cover-title,
  .book-placeholder .book-cover-author {
    color: #8b7355;
  }
  .placeholder-text {
    font-size: 1.6rem;
    margin-bottom: 0.5rem;
  }

  /* Book meta below cover */
  .book-meta {
    text-align: center;
    margin-top: 0.8rem;
  }
  .book-meta-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #3d3226;
    margin-bottom: 0.15rem;
  }
  .book-meta-author {
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.7rem;
    color: #8b7355;
  }
  .book-card:hover .book-meta-title {
    color: #8b4513;
  }

  /* Book count badge */
  .book-count {
    display: inline-block;
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.75rem;
    color: #8b7355;
    background: rgba(139,115,85,0.1);
    padding: 0.3rem 0.8rem;
    border-radius: 100px;
    margin-top: 2.5rem;
    letter-spacing: 0.06em;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 2.5rem 2rem 3rem;
    border-top: 1px solid rgba(139,115,85,0.15);
    max-width: 1100px;
    margin: 0 auto;
  }
  .footer p {
    font-family: "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 0.8rem;
    color: #a09080;
    letter-spacing: 0.06em;
  }
  .footer a {
    color: #8b7355;
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer a:hover {
    color: #5a3e2b;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .hero {
      min-height: 40vh;
    }
    .hero h1 {
      font-size: 1.8rem;
    }
    .hero-subtitle {
      font-size: 0.85rem;
    }
    .bookshelf {
      gap: 1.5rem;
      padding: 2rem 1rem 1.5rem;
    }
    .book-card {
      width: 130px;
    }
    .book-cover {
      width: 110px;
      height: 158px;
    }
    .book-cover-title {
      font-size: 0.9rem;
    }
    .book-cover-icon {
      font-size: 1.6rem;
    }
    .shelf-section {
      padding: 2rem 1rem 3rem;
    }
    .shelf-header h2 {
      font-size: 1.3rem;
    }
  }

  @media (max-width: 480px) {
    .bookshelf {
      gap: 1rem;
      padding: 1.5rem 0.6rem 1.2rem;
    }
    .book-card {
      width: 110px;
    }
    .book-cover {
      width: 90px;
      height: 132px;
    }
    .book-cover-title {
      font-size: 0.78rem;
    }
    .book-cover-icon {
      font-size: 1.3rem;
    }
    .book-meta-title {
      font-size: 0.75rem;
    }
  }
</style>
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-content">
      <div class="hero-tag">READING NOTES</div>
      <h1>读书笔记</h1>
      <p class="hero-subtitle">阅读、思考、记录 &mdash; 把书读进生活里</p>
    </div>
  </header>

  <!-- Bookshelf -->
  <section class="shelf-section reveal-on-load">
    <div class="shelf-header">
      <h2>书架</h2>
      <p>翻开的每一本书，都是一次思维的重塑</p>
    </div>

    <div class="bookshelf">

      <!-- Book 1: 终身成长 -->
      <a href="books/mindset/" class="book-card book-mindset">
        <div class="book-cover">
          <div class="book-cover-inner">
            <div class="book-cover-icon">&#9670;</div>
            <div class="book-cover-title">终身成长</div>
            <div class="book-cover-author">卡罗尔·德韦克</div>
          </div>
        </div>
        <div class="book-meta">
          <div class="book-meta-title">终身成长</div>
          <div class="book-meta-author">卡罗尔·德韦克</div>
        </div>
      </a>

      <!-- Book 2: 思考，快与慢 -->
      <a href="books/thinking-fast-slow/" class="book-card book-thinking">
        <div class="book-cover">
          <div class="book-cover-inner">
            <div class="book-cover-icon">&#9650;</div>
            <div class="book-cover-title">思考，<br>快与慢</div>
            <div class="book-cover-author">丹尼尔·卡尼曼</div>
          </div>
        </div>
        <div class="book-meta">
          <div class="book-meta-title">思考，快与慢</div>
          <div class="book-meta-author">丹尼尔·卡尼曼</div>
        </div>
      </a>

      <!-- Future books: placeholder 1 -->
      <div class="book-card book-placeholder">
        <div class="book-cover">
          <div class="book-cover-inner">
            <div class="placeholder-text">?</div>
            <div class="book-cover-title">待上架</div>
          </div>
        </div>
      </div>

      <!-- Future books: placeholder 2 -->
      <div class="book-card book-placeholder">
        <div class="book-cover">
          <div class="book-cover-inner">
            <div class="placeholder-text">?</div>
            <div class="book-cover-title">待上架</div>
          </div>
        </div>
      </div>

    </div>

    <div style="text-align:center;">
      <span class="book-count">已收录 2 本，持续更新中</span>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>
      读书笔记 &middot;
      <a href="https://github.com/Acidache/reading-notes-mindset" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>

<script>
  // Reveal shelf section on load
  const shelf = document.querySelector('.reveal-on-load');
  if (shelf) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => shelf.classList.add('reveal'));
    } else {
      shelf.classList.add('reveal');
    }
  }
</script>

</body>
</html>
